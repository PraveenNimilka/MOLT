[project]
name = "molt-ai-infrastructure"
version = "0.9.0"
description = "Research-grade local AI training and measurement infrastructure"
readme = "README.md"
license = "MIT"
keywords = ["machine-learning", "local-ai", "training", "energy-measurement", "qlora"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows :: Windows 11",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2.1.0",
  "nvidia-ml-py>=13.580.65",
  "psutil>=7.0.0",
  "torch==2.8.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.4.0"]
windows-fusion = ["triton-windows>=3.4,<3.5"]
qlora = [
  "accelerate>=1.10,<2",
  "bitsandbytes>=0.48,<1",
  "peft>=0.17,<1",
  "transformers>=5,<6",
]

[project.scripts]
molt = "molt_stream.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/molt_stream"]

[tool.hatch.build.targets.sdist]
exclude = [
  "/.c",
  "/.pytest_cache",
  "/.venv",
  "/artifacts",
  "/data/prepared",
  "/dist",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
cache_dir = ".c/pytest"

[tool.uv]
default-groups = ["dev"]

[dependency-groups]
dev = ["pytest>=8.4.0"]

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch" }
