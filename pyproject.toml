[project]
name = "moltengine"
version = "0.10.0a2"
description = "Research-grade local AI training and measurement infrastructure"
readme = "README.md"
license = "MIT"
authors = [{ name = "Praveen Nimilka" }]
keywords = ["machine-learning", "local-ai", "training", "energy-measurement", "qlora"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows :: Windows 11",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2.1,<3",
  "nvidia-ml-py>=13.580.65,<14",
  "psutil>=7,<8",
  "torch>=2.8,<2.9",
]

[project.urls]
Homepage = "https://github.com/PraveenNimilka/MOLT"
Documentation = "https://github.com/PraveenNimilka/MOLT/tree/main/docs"
Repository = "https://github.com/PraveenNimilka/MOLT.git"
Issues = "https://github.com/PraveenNimilka/MOLT/issues"
Changelog = "https://github.com/PraveenNimilka/MOLT/blob/main/docs/releases/0.10.0-alpha.2.md"

[project.optional-dependencies]
dev = ["pytest>=8.4.0"]
windows-fusion = ["torch==2.8.0", "triton-windows>=3.4,<3.5; sys_platform == 'win32'"]
qlora = [
  "accelerate>=1.10,<2",
  "bitsandbytes>=0.48,<1",
  "peft>=0.17,<1",
  "transformers>=5,<6",
]
data = ["pyarrow>=19,<24"]

[project.scripts]
molt = "molt_stream.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/molt_stream"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/LICENSE",
  "/README.md",
  "/SECURITY.md",
  "/pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
cache_dir = ".c/pytest"

[tool.uv]
default-groups = ["dev"]

[dependency-groups]
dev = ["pytest>=8.4.0"]

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch" }
