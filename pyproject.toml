[project]
name = "molt-ai-infrastructure"
version = "0.2.0"
description = "Research-grade local AI training and measurement infrastructure"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2.1.0",
  "nvidia-ml-py>=13.580.65",
  "psutil>=7.0.0",
  "tokenizers>=0.22.0,<0.23",
  "torch==2.8.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.4.0"]
windows-fusion = ["triton-windows>=3.4,<3.5"]

[project.scripts]
molt = "molt_stream.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/molt_stream"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.uv]
default-groups = ["dev"]

[dependency-groups]
dev = ["pytest>=8.4.0"]

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch" }
