name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows-python-312:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run python -m pytest -q
